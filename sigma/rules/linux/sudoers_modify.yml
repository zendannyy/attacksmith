title: Sudoers NOPASSWD Modification
id: ef5a5b75-6a62-41d8-8e64-6baa064faec1
status: test
description: Detects an interactive shell writing a NOPASSWD or ALL=(ALL) rule into /etc/sudoers.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_sudoers:
    process.command_line|contains:
      - /etc/sudoers
  selection_nopasswd:
    process.command_line|contains:
      - NOPASSWD
      - "ALL=(ALL)"
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.003
