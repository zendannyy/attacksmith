title: Bashrc Persistence Hook
id: linux_audit_bashrc_persistence
status: experimental
description: Detects appending attacker commands to a shell rc file from an interactive terminal.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_rc_path:
    process.command_line|contains:
      - ".bashrc"
      - ".zshrc"
      - ".profile"
  selection_write:
    process.command_line|contains:
      - ">>"
      - "tee -a"
  selection_shell:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.persistence
  - attack.t1546.004
