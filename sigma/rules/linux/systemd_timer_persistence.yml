title: Systemd User Timer Persistence
id: linux_audit_systemd_timer_persistence
status: experimental
description: Detects writing a systemd user timer unit from an interactive shell.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_timer_path:
    process.command_line|contains:
      - systemd/user/
      - ".timer"
  selection_write:
    process.command_line|contains:
      - ">"
      - "tee "
      - "vi "
  selection_shell:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.persistence
  - attack.t1053.006
