title: Python Reverse PTY Shell
id: ad07d775-d20f-4d30-9178-ad11dc6227fb
status: experimental
description: Detects Python launching an in-memory reverse shell with socket connect and pty.spawn.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_python:
    process.name:
      - python
      - python3
  selection_socket:
    process.command_line|contains:
      - "socket"
      - "connect("
  selection_pty:
    process.command_line|contains:
      - pty.spawn
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.execution
  - attack.command_and_control
  - attack.t1059.006
