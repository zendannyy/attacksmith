title: SCP or Rsync Lateral Tool Transfer
id: d957ba3a-3ccf-4511-9eba-6f16f1c572d2
status: experimental
description: Detects scp or rsync copying files to an internal host from an interactive shell.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_tool:
    process.name:
      - scp
      - rsync
  selection_rfc1918:
    process.command_line|contains:
      - " -r"
      - "@10."
      - "@192.168."
      - "@172.16."
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.lateral_movement
  - attack.t1570
