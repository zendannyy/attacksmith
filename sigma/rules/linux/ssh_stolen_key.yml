title: SSH Private Key from Temp Path
id: linux_audit_ssh_stolen_key
status: experimental
description: Detects SSH using an identity file staged under /tmp or /dev/shm.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_ssh:
    process.name: ssh
  selection_identity:
    process.command_line|contains:
      - " -i /tmp/"
      - " -i /dev/shm/"
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.004
