title: Pkexec Root Shell
id: 6a3bb033-d4ba-41bb-8998-abb8edaca9b9
status: experimental
description: >
  Detects pkexec launching a shell from an interactive terminal.
  This lets an authorized user execute a program as another user,
  typically root.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_pkexec:
    process.name: pkexec
  selection_shell:
    process.command_line|contains:
      - "/bin/bash"
      - "/bin/sh"
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.privilege-escalation
  - attack.t1548
