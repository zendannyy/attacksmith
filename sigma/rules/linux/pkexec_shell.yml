title: Pkexec Root Shell
id: linux_audit_pkexec_shell
status: experimental
description: Detects pkexec launching a shell from an interactive terminal, 
this utility allows an authorized user to execute a program as another user, typically the root user.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_pkexec:
    process.name: pkexec
  selection_shell:
    process.command_line|contains:
      - "/bin/bash"
      - "/bin/sh"
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548
