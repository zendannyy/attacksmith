title: Setuid Bit via Chmod
id: linux_audit_suid_chmod
status: experimental
description: Detects chmod enabling the setuid bit on a binary from an interactive shell.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_chmod:
    process.name: chmod
  selection_suid:
    process.command_line|contains:
      - "u+s"
      - "4755"
      - "4777"
      - "4711"
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.001
