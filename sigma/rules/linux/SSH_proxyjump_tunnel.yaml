title: SSH ProxyJump / ProxyCommand Tunnel
id: linux_audit_ssh_proxy_tunnel
status: experimental
description: Detects SSH proxying via ProxyJump, -J, or ProxyCommand from an interactive shell.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_ssh:
    process.name: ssh
  selection_proxy:
    process.command_line|contains:
      - ProxyCommand
      - ProxyJump
      - " -J "
      - " -J"
  selection_shell:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.command_and_control
  - attack.t1090
