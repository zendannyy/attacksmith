title: Socat Reverse Shell C2
id: 6963ef0f-a54f-49f9-b310-2e85c57f4c66
status: experimental
description: Detects socat used to establish a reverse TCP shell from an interactive terminal.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_socat:
    process.name: socat
  selection_reverse:
    process.command_line|contains:
      - "TCP:"
      - "tcp:"
      - "EXEC:"
      - "exec:"
  selection_shell:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.command_and_control
  - attack.t1090
