title: SSH Lateral Movement to RFC1918 Host
id: linux_audit_ssh_lateral
status: experimental
description: Detects interactive SSH to an internal (RFC1918) host. East to West.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_ssh:
    process.name: ssh
  selection_rfc1918:
    process.command_line|contains:
      - "root@10."
      - "root@192.168."
      - "root@172.16."
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: selection_ssh and any of rfc1918 and all of selection_*
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.004
