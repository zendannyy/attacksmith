title: Dynamic Linker Hijack via ld.so.preload
id: linux_audit_ld_preload
status: experimental
description: Detects an interactive shell writing a shared object path into /etc/ld.so.preload.
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_preload:
    process.command_line|contains:
      - /etc/ld.so.preload
  selection_write:
    process.command_line|contains:
      - ">"
      - "tee "
  selection_parent:
    process.parent.name:
      - bash
      - zsh
      - sh
  selection_terminal:
    process.tty|startswith:
      - pts
      - tty
  condition: all of selection_*
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1574.006
