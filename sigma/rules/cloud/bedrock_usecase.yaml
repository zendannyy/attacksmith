title: AWS Bedrock Foundation Model Access with Long-Lived Keys
id: 7c2e1a4b-9d3f-4c8a-b1e0-2f6a8d4c9e11
status: experimental
description: >
  Detects Bedrock foundation-model availability, use-case of API calls authenticated with a long-lived IAM access key
  (AKIA*).
author: ATT&CKSMITH
date: 2026/07/27
references:
  - https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds-programmatic-access.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_events:
    eventName:
      - PutUseCaseForModelAccess
      - GetUseCaseForModelAccess
  selection_longlived_key:
    userIdentity.accessKeyId|startswith: AKIA
  condition: all of selection_*
falsepositives:
  - Legitimate admin onboarding of Bedrock model access with IAM user keys
level: medium
tags:
  - attack.discovery
  - attack.t1526
