title: Suspicious Notepad Spawned by Command Shell
id: f813faad-0e6b-4403-b620-7f384f70efa4
status: experimental
description: >
  Detects notepad.exe launched by cmd.exe. Benign notepad is normally started
  by explorer.exe; a command-shell parent is a common living-off-the-land and
  post-exploitation pattern (ATT&CK T1036 / defense evasion context).
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection:
    process.name: notepad.exe
    process.parent.name: cmd.exe
  condition: selection
level: medium
tags:
  - attack.defense_evasion
  - attack.t1036
