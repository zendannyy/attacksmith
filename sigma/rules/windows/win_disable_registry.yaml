title: Windows Disable Registry Tool (T1112)
id: win_disable_registry
status: experimental
description: |
  Hunting rule based off of Atomic T1112 test "Disable Windows Registry Tool" (Modify Registry). Correlate with additional signals before alerting.
author: zendannyy
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://github.com/redcanaryco/atomic-red-team/tree/master/atomics/T1112
  - https://any.run/report/ea4ea08407d4ee72e009103a3b77e5a09412b722fdef67315ea63f22011152af/a866d7b1-c236-4f26-a391-5ae32213dfc4
tags:
  - attack.execution
  - attack.t1112
  - attack.hunting
logsource:
  product: windows
  category: process_creation
detection:
  selection_binary:
    Image|endswith: '\\reg.exe'
  selection_cmd:
    CommandLine|contains:
      - 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\policies\system'
      - 'Software\Microsoft\Windows\CurrentVersion\policies\system'
      - 'DisableRegistryTools /t REG_DWORD /d 1 '
  condition: selection_binary and 1 of selection_cmd
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
falsepositives:
  - Authorized red team or security assessment activity
level: medium
