title: Suspicious Encoded PowerShell Command
id: fbe4fe92-1f1d-4f24-b218-f35868d3a688
status: experimental
description: >
  Detects PowerShell launched with an encoded command from an interactive
  parent shell (ATT&CK T1059.001).
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection_powershell:
    process.name:
      - powershell.exe
      - pwsh.exe
  selection_encoded:
    process.command_line|contains:
      - "-EncodedCommand"
      - "-enc "
      - "-Enc "
  selection_parent:
    process.parent.name:
      - cmd.exe
      - powershell.exe
      - explorer.exe
  condition: all of selection_*
fields:
    - ParentImage
    - Image
    - CommandLine
    - User
level: medium
