title: Suspicious Encoded PowerShell Command
id: win_sysmon_powershell_encoded
status: experimental
description: >
  Detects PowerShell launched with an encoded command from an interactive
  parent shell (ATT&CK T1059.001).
logsource:
  product: windows
  service: sysmon
  category: process_creation
detection:
  selection_powershell:
    process.name:
      - powershell.exe
      - pwsh.exe
  selection_encoded:
    process.command_line|contains:
      - "-EncodedCommand"
      - "-enc "
      - "-Enc "
  selection_parent:
    process.parent.name:
      - cmd.exe
      - powershell.exe
      - explorer.exe
  condition: all of selection_*
level: high
tags:
  - attack.execution
  - attack.t1059.001
